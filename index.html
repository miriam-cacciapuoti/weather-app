<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Weather App</title>
  </head>

  <body>
    <header>
      <h1>My Weather App</h1>
      <form action="/submit" method="get">
        <input type="text" id="city" name="city" placeholder="Enter a city.." />
        <button type="submit">Search</button>
      </form>
    </header>

    <main>
      <h2>Krakow</h2>
      <p>Friday 13:11, cloudy<br />Humidity: 56%, Wind: 13 km/h</p>
      <p>☁ -1°</p>

      <ul>
        <li>Sat ☁<br />1° / -2°</li>
        <li>Sun ☁<br />1° / -3°</li>
        <li>Mon ☁<br />0° / -2°</li>
        <li>Tue ☀<br />-1° / -3°</li>
        <li>Thu ?<br />-2° / -5°</li>
      </ul>
    </main>

    <footer>
      This project was coded by
      <a href="" target="_blank">Miriam Cacciapuoti</a> and is
      <a
        href="https://github.com/miriam-cacciapuoti/weather-app"
        target="_blank"
        >on GitHub</a
      >
      and
      <a href="https://relaxed-belekoy-1e1423.netlify.app/" target="_blank"
        >hosted on Netlify</a
      >
    </footer>
  </body>
</html>
